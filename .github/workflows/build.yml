name: Build Lavender 4.4 BakaSU + NoMount

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2-utils lzop python3 unzip wget zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          CLANG_OK=0
          for i in 1 2 3 4 5; do
            echo "[INFO] Mengunduh Clang r383902 (percobaan $i/5)..."
            rm -f clang.tar.gz
            if curl -fSL --connect-timeout 30 --max-time 300 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
              -o clang.tar.gz && tar -tzf clang.tar.gz >/dev/null 2>&1; then
              tar -xzf clang.tar.gz -C clang
              rm -f clang.tar.gz
              CLANG_OK=1
              break
            fi
            sleep 5
          done
          if [ "$CLANG_OK" -ne 1 ]; then
            echo "[WARN] Server Google memutus unduhan, beralih ke Clang bawaan Ubuntu..."
            sudo apt-get install -y clang lld llvm
            mkdir -p clang/bin
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              [ -x "/usr/bin/$tool" ] && ln -sf "/usr/bin/$tool" "clang/bin/$tool"
            done
          fi

      - name: Jalankan Build 4.4 BakaSU + NoMount
        run: |
          chmod +x build_nomount.sh
          ./build_nomount.sh

      - name: Bungkus ke AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=XtrSolRadical 4.4 BakaSU + NoMount
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Lavender-4.4-XtrSolRadical-BakaSU-NoMount.zip * -x .git README.md *placeholder

      - name: Upload Hasil ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lavender-4.4-XtrSolRadical-BakaSU-NoMount
          path: Lavender-4.4-XtrSolRadical-BakaSU-NoMount.zip
